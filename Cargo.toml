[package]
name = "rcn"
version = "1.0.1"
edition = "2021"
rust-version = "1.86"
description = "Leveled Rust compressor (wire LZ, byte CM, hybrid BWT/CM) aiming to win ratio and compress speed vs each peer class"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rinchen/rcn"

[dependencies]
clap = { version = "4.5.5", features = ["derive"] }
byteorder = "1.5"
crc32fast = "1.5"
thiserror = "2"
ans = "0.4"
divsufsort = "2.0"
mimalloc = "0.1"
rayon = "1"
libsais-rs = { version = "0.2.2", default-features = false, optional = true }

[features]
default = ["two_pass", "bwt_libsais"]
two_pass = []
no_avx2 = []
# Optional libsais SA-IS BWT backend (pure-Rust libsais-rs). Default on (W7).
bwt_libsais = ["dep:libsais-rs"]

[dev-dependencies]
criterion = "0.8"